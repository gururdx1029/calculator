<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Calculator 😎</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#101827,#252044,#111827);color:white}
.card{width:min(92vw,440px);padding:28px 22px;border-radius:24px;text-align:center;background:rgba(255,255,255,.09);backdrop-filter:blur(12px);box-shadow:0 15px 50px rgba(0,0,0,.4)}
input{width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:17px}button{margin-top:10px;padding:15px 25px;border:0;border-radius:999px;font-size:17px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:50px;position:relative;z-index:10}
#result{display:none}.line{margin:18px 0;min-height:25px}.big{font-size:22px;font-weight:bold}.credit{margin-top:22px;opacity:.6;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div id="start"><h1>🧮 Super Calculator</h1><p>Koi bhi 2 numbers dalo 😎</p>
<input id="a" type="number" inputmode="decimal" placeholder="First number">
<input id="b" type="number" inputmode="decimal" placeholder="Another number">
<form id="calcForm"><button type="submit">Calculate 🚀</button></form></div>
<div id="result"><div id="messages"></div></div>
</div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function show(text,ms){let d=document.createElement("div");d.className="line";d.textContent=text;document.getElementById("messages").appendChild(d);await wait(ms)}
async function startCalculation(){
if(document.getElementById("a").value===""||document.getElementById("b").value===""){alert("Dono numbers dalo 😭");return}
document.getElementById("start").style.display="none";document.getElementById("result").style.display="block";
let m=document.getElementById("messages"),l=document.createElement("div");l.className="line";l.textContent="adding the no.";m.appendChild(l);
for(let i=0;i<3;i++){await wait(1000);l.textContent+="."}
await show("✨ Itna muskil kyu pucha ✨",2000);
await show("Calling Einstein",3000);await show("hello Einstein",3000);await show("Tumhe bhi ni pata",3000);
await show("Taking data from NASA",3000);await show("using Calculator",3000);
await show("→ bas 1 min",2000);await show("→ Raste me hai",2000);await show("→ aa hi gaya bas",2000);
await show("Mil gaya:",5000);
let a=document.createElement("div");a.className="big";a.textContent="2+2=5😎😎";m.appendChild(a);
await wait(3000);await show("Conclusion:-",3000);await show("math ki class bunk kari thi",0);
let c=document.createElement("div");c.className="credit";c.textContent="made by gauransh";m.appendChild(c);
}

document.getElementById("calcForm").addEventListener("submit", function(e) {
  e.preventDefault();
  startCalculation();
});
</script>
</body>
</html>
